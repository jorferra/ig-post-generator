<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="IG Post">
    <link rel="manifest" href="manifest.json">
    <title>Minimal IG Post Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #F5F5F5;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #000;
        }
        
        .controls {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #333;
        }
        
        textarea {
            width: 100%;
            min-height: 120px;
            padding: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 4px;
            resize: vertical;
            margin-bottom: 16px;
        }
        
        .size-controls {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }
        
        .size-btn {
            flex: 1;
            padding: 10px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            cursor: pointer;
            transition: all 150ms;
        }
        
        .size-btn.active {
            background: #000;
            color: #fff;
            border-color: #000;
        }
        
        .weight-controls {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .weight-btn {
            flex: 1;
            padding: 10px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            cursor: pointer;
            transition: all 150ms;
        }
        
        .weight-btn.active {
            background: #000;
            color: #fff;
            border-color: #000;
        }
        
        .align-btn {
            flex: 1;
            padding: 10px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            cursor: pointer;
            transition: all 150ms;
        }
        
        .align-btn.active {
            background: #000;
            color: #fff;
            border-color: #000;
        }
        
        .download-btn {
            width: 100%;
            padding: 14px;
            background: #000;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .preview-container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
        }
        
        .preview-label {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 12px;
            color: #333;
        }
        
        #canvas {
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 4px;
            pointer-events: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        .info {
            margin-top: 12px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Minimal IG Post Generator</h1>
        
        <div class="controls">
            <label>Text</label>
            <textarea id="textInput" placeholder="Type your text here...">I build AI automation systems,
content pipelines,
and decision tools.</textarea>
            
            <label>Size</label>
            <div class="size-controls">
                <button class="size-btn" data-size="42">Small</button>
                <button class="size-btn active" data-size="52">Medium</button>
                <button class="size-btn" data-size="62">Large</button>
            </div>
            
            <label>Weight</label>
            <div class="weight-controls">
                <button class="weight-btn" data-weight="400">Regular</button>
                <button class="weight-btn active" data-weight="500">Medium</button>
                <button class="weight-btn" data-weight="600">Semibold</button>
            </div>
            
            <label>Alignment</label>
            <div class="weight-controls">
                <button class="align-btn" data-align="left">Left</button>
                <button class="align-btn active" data-align="center">Center</button>
                <button class="align-btn" data-align="right">Right</button>
            </div>
            
            <button class="download-btn" id="downloadBtn">Download (1080x1080)</button>
            <button class="download-btn" id="shareBtn" style="background: #333; margin-top: 12px;">Share / Save Image</button>
        </div>
        
        <div class="preview-container">
            <div class="preview-label">Preview</div>
            <canvas id="canvas" width="1080" height="1080"></canvas>
            <div class="info">White background, black text. Tap-hold image to save on mobile.</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const textInput = document.getElementById('textInput');
        const downloadBtn = document.getElementById('downloadBtn');
        const shareBtn = document.getElementById('shareBtn');
        
        let fontSize = 52;
        let fontWeight = 500;
        let textAlign = 'center';
        
        // Load Inter font
        const font = new FontFace('Inter', 'url(https://fonts.gstatic.com/s/inter/v12/UcCO3FwrK3iLTeHuS_fvQtMwCp50KnMw2boKoduKmMEVuLyfAZ9hiA.woff2)');
        font.load().then(() => {
            document.fonts.add(font);
            drawCanvas();
        });
        
        function wrapText(text, maxWidth) {
            const words = text.split(' ');
            const lines = [];
            let currentLine = '';
            
            words.forEach(word => {
                const testLine = currentLine + (currentLine ? ' ' : '') + word;
                const metrics = ctx.measureText(testLine);
                
                if (metrics.width > maxWidth && currentLine) {
                    lines.push(currentLine);
                    currentLine = word;
                } else {
                    currentLine = testLine;
                }
            });
            
            if (currentLine) {
                lines.push(currentLine);
            }
            
            return lines;
        }
        
        function drawCanvas() {
            // Clear canvas
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, 1080, 1080);
            
            // Set text style
            ctx.fillStyle = '#000000';
            ctx.font = `${fontWeight} ${fontSize}px Inter`;
            ctx.textAlign = textAlign;
            ctx.textBaseline = 'middle';
            
            // Calculate max width based on alignment
            const padding = 120;
            const maxWidth = 1080 - (padding * 2);
            
            // Split text by manual line breaks, then wrap long lines
            const text = textInput.value;
            const paragraphs = text.split('\n');
            const allLines = [];
            
            paragraphs.forEach(paragraph => {
                if (paragraph.trim() === '') {
                    allLines.push('');
                } else {
                    const wrapped = wrapText(paragraph, maxWidth);
                    allLines.push(...wrapped);
                }
            });
            
            const lineHeight = fontSize * 1.4;
            const totalHeight = allLines.length * lineHeight;
            const startY = (1080 - totalHeight) / 2 + lineHeight / 2;
            
            // Set X position based on alignment
            let x = 540; // center default
            if (textAlign === 'left') x = padding;
            if (textAlign === 'right') x = 1080 - padding;
            
            allLines.forEach((line, i) => {
                ctx.fillText(line, x, startY + i * lineHeight);
            });
        }
        
        // Event listeners
        textInput.addEventListener('input', drawCanvas);
        
        document.querySelectorAll('.size-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                fontSize = parseInt(btn.dataset.size);
                drawCanvas();
            });
        });
        
        document.querySelectorAll('.weight-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.weight-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                fontWeight = parseInt(btn.dataset.weight);
                drawCanvas();
            });
        });
        
        document.querySelectorAll('.align-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.align-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                textAlign = btn.dataset.align;
                drawCanvas();
            });
        });
        
        downloadBtn.addEventListener('click', () => {
            // Convert canvas to blob for better mobile compatibility
            canvas.toBlob((blob) => {
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = 'ig-post.png';
                link.href = url;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            }, 'image/png');
        });
        
        shareBtn.addEventListener('click', async () => {
            try {
                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
                const file = new File([blob], 'ig-post.png', { type: 'image/png' });
                
                if (navigator.share && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        files: [file],
                        title: 'IG Post'
                    });
                } else {
                    // Fallback: open in new window for manual save
                    const url = URL.createObjectURL(blob);
                    window.open(url, '_blank');
                }
            } catch (err) {
                console.log('Share failed:', err);
            }
        });
        
        // Register service worker for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => {
                console.log('Service worker registration failed:', err);
            });
        }
    </script>
</body>
</html>
