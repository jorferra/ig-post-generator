<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal IG Post Generator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #F5F5F5;
            padding: 20px;
            transition: background 200ms, color 200ms;
        }

        body.dark {
            background: #111;
            color: #fff;
        }

        .container { max-width: 600px; margin: 0 auto; }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        h1 { font-size: 24px; font-weight: 600; color: #000; }
        body.dark h1 { color: #fff; }

        #themeToggle {
            padding: 8px 14px;
            border-radius: 4px;
            border: 1px solid #ddd;
            background: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            cursor: pointer;
            transition: all 150ms;
        }
        body.dark #themeToggle {
            background: #222;
            border-color: #444;
            color: #fff;
        }

        .controls {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            transition: background 200ms;
        }
        body.dark .controls { background: #1e1e1e; }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #333;
        }
        body.dark label { color: #aaa; }

        textarea {
            width: 100%;
            min-height: 120px;
            padding: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 4px;
            resize: vertical;
            margin-bottom: 16px;
            transition: background 200ms, color 200ms, border-color 200ms;
        }
        body.dark textarea {
            background: #2a2a2a;
            color: #fff;
            border-color: #444;
        }

        .btn-row { display: flex; gap: 12px; margin-bottom: 16px; }

        .control-btn {
            flex: 1;
            padding: 10px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            cursor: pointer;
            transition: all 150ms;
        }
        body.dark .control-btn {
            background: #2a2a2a;
            border-color: #444;
            color: #ccc;
        }

        .control-btn.active {
            background: #000;
            color: #fff;
            border-color: #000;
        }
        body.dark .control-btn.active {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .action-row { display: flex; gap: 12px; margin-top: 4px; }

        .download-btn {
            flex: 1;
            padding: 14px;
            background: #000;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 150ms;
        }
        body.dark .download-btn { background: #fff; color: #000; }
        .download-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        #copyLinkBtn {
            padding: 14px 18px;
            background: #fff;
            color: #000;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            cursor: pointer;
            transition: all 150ms;
            white-space: nowrap;
        }
        body.dark #copyLinkBtn {
            background: #2a2a2a;
            color: #fff;
            border-color: #444;
        }
        #copyLinkBtn.copied { background: #000; color: #fff; border-color: #000; }
        body.dark #copyLinkBtn.copied { background: #fff; color: #000; border-color: #fff; }

        .preview-container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            transition: background 200ms;
        }
        body.dark .preview-container { background: #1e1e1e; }

        .preview-label { font-size: 14px; font-weight: 500; margin-bottom: 12px; color: #333; }
        body.dark .preview-label { color: #aaa; }

        #canvas {
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 4px;
            pointer-events: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body.dark #canvas { border-color: #444; }

        .info { margin-top: 12px; font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Minimal IG Post</h1>
            <button id="themeToggle">☀️ Light</button>
        </div>

        <div class="controls">
            <label>Text</label>
            <textarea id="textInput" placeholder="Escribí tu texto acá..."></textarea>

            <label>Size</label>
            <div class="btn-row">
                <button class="control-btn" data-size="42">Small</button>
                <button class="control-btn active" data-size="52">Medium</button>
                <button class="control-btn" data-size="62">Large</button>
            </div>

            <label>Weight</label>
            <div class="btn-row">
                <button class="control-btn" data-weight="400">Regular</button>
                <button class="control-btn active" data-weight="500">Medium</button>
                <button class="control-btn" data-weight="600">Semibold</button>
            </div>

            <label>Alignment</label>
            <div class="btn-row">
                <button class="control-btn" data-align="left">Left</button>
                <button class="control-btn active" data-align="center">Center</button>
                <button class="control-btn" data-align="right">Right</button>
            </div>

            <div class="action-row">
                <button class="download-btn" id="downloadBtn" disabled>Download 1080×1080</button>
                <button id="copyLinkBtn">🔗 Copiar link</button>
            </div>
        </div>

        <div class="preview-container">
            <div class="preview-label">Preview</div>
            <canvas id="canvas" width="1080" height="1080"></canvas>
            <div class="info">Tap-hold en mobile para guardar la imagen.</div>
        </div>
    </div>

    <script>
        const CANVAS_SIZE       = 1080;
        const PADDING           = 120;
        const LINE_HEIGHT_RATIO = 1.4;
        const STORAGE_KEY       = 'igpost_text';

        const canvas      = document.getElementById('canvas');
        const ctx         = canvas.getContext('2d');
        const textInput   = document.getElementById('textInput');
        const downloadBtn = document.getElementById('downloadBtn');
        const copyLinkBtn = document.getElementById('copyLinkBtn');
        const themeToggle = document.getElementById('themeToggle');

        let fontSize   = 52;
        let fontWeight = 500;
        let textAlign  = 'center';
        let fontLoaded = false;
        let darkMode   = false;

        // ── Theme ────────────────────────────────────────────────────────────
        function applyTheme(dark) {
            darkMode = dark;
            document.body.classList.toggle('dark', dark);
            themeToggle.textContent = dark ? '☀️ Light' : '🌙 Dark';
            if (fontLoaded) drawCanvas();
        }

        themeToggle.addEventListener('click', () => applyTheme(!darkMode));

        // ── Restore text from URL param, then localStorage ───────────────────
        const urlText = new URLSearchParams(location.search).get('t');
        if (urlText) {
            textInput.value = urlText;
        } else {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) textInput.value = saved;
            } catch {}
        }

        // Default placeholder if still empty
        if (!textInput.value) {
            textInput.value = 'I build AI automation systems,\ncontent pipelines,\nand decision tools.';
        }

        // ── Save to localStorage on every keystroke ──────────────────────────
        textInput.addEventListener('input', () => {
            try { localStorage.setItem(STORAGE_KEY, textInput.value); } catch {}
            if (fontLoaded) scheduleRedraw();
        });

        // ── Copy shareable link ──────────────────────────────────────────────
        copyLinkBtn.addEventListener('click', () => {
            const url = new URL(location.href);
            url.searchParams.set('t', textInput.value);
            navigator.clipboard.writeText(url.toString()).then(() => {
                copyLinkBtn.textContent = '✅ Copiado';
                copyLinkBtn.classList.add('copied');
                setTimeout(() => {
                    copyLinkBtn.textContent = '🔗 Copiar link';
                    copyLinkBtn.classList.remove('copied');
                }, 2000);
            }).catch(() => {
                prompt('Copiá el link:', url.toString());
            });
        });

        // ── Font ─────────────────────────────────────────────────────────────
        const interFont = new FontFace(
            'Inter',
            'url(https://fonts.gstatic.com/s/inter/v12/UcCO3FwrK3iLTeHuS_fvQtMwCp50KnMw2boKoduKmMEVuLyfAZ9hiA.woff2)'
        );
        interFont.load().then(f => {
            document.fonts.add(f);
            fontLoaded = true;
            downloadBtn.disabled = false;
            drawCanvas();
        }).catch(() => {
            fontLoaded = true;
            downloadBtn.disabled = false;
            drawCanvas();
        });

        // ── RAF debounce ──────────────────────────────────────────────────────
        let rafId = null;
        function scheduleRedraw() {
            if (rafId) cancelAnimationFrame(rafId);
            rafId = requestAnimationFrame(() => { rafId = null; drawCanvas(); });
        }

        // ── Canvas drawing ────────────────────────────────────────────────────
        function wrapText(text, maxWidth) {
            const words = text.split(' ');
            const lines = [];
            let currentLine = '';

            for (const word of words) {
                if (ctx.measureText(word).width > maxWidth) {
                    if (currentLine) { lines.push(currentLine); currentLine = ''; }
                    let clipped = word;
                    while (clipped.length > 1 && ctx.measureText(clipped + '…').width > maxWidth) {
                        clipped = clipped.slice(0, -1);
                    }
                    lines.push(clipped + '…');
                    continue;
                }
                const candidate = currentLine ? currentLine + ' ' + word : word;
                if (ctx.measureText(candidate).width > maxWidth && currentLine) {
                    lines.push(currentLine);
                    currentLine = word;
                } else {
                    currentLine = candidate;
                }
            }
            if (currentLine) lines.push(currentLine);
            return lines;
        }

        function drawCanvas() {
            const bg   = darkMode ? '#000000' : '#FFFFFF';
            const fg   = darkMode ? '#FFFFFF' : '#000000';

            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            ctx.fillStyle    = fg;
            ctx.font         = `${fontWeight} ${fontSize}px Inter, sans-serif`;
            ctx.textAlign    = textAlign;
            ctx.textBaseline = 'middle';

            const maxWidth = CANVAS_SIZE - PADDING * 2;
            const allLines = [];

            for (const paragraph of textInput.value.split('\n')) {
                if (paragraph.trim() === '') {
                    allLines.push('');
                } else {
                    allLines.push(...wrapText(paragraph, maxWidth));
                }
            }

            const lineHeight  = fontSize * LINE_HEIGHT_RATIO;
            const totalHeight = allLines.length * lineHeight;
            const startY      = (CANVAS_SIZE - totalHeight) / 2 + lineHeight / 2;

            const x = textAlign === 'left'  ? PADDING :
                      textAlign === 'right' ? CANVAS_SIZE - PADDING :
                      CANVAS_SIZE / 2;

            allLines.forEach((line, i) => ctx.fillText(line, x, startY + i * lineHeight));
        }

        // ── Download / Share ──────────────────────────────────────────────────
        function getCanvasBlob() {
            return new Promise((resolve, reject) => {
                canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('toBlob null')), 'image/png');
            });
        }

        function triggerDownload(blob, filename) {
            const url  = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.download = filename;
            link.href     = url;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        downloadBtn.addEventListener('click', async () => {
            try {
                const blob = await getCanvasBlob();
                const file = new File([blob], 'ig-post.png', { type: 'image/png' });
                if (navigator.share && navigator.canShare({ files: [file] })) {
                    await navigator.share({ files: [file], title: 'IG Post' });
                } else {
                    triggerDownload(blob, 'ig-post.png');
                }
            } catch (err) {
                if (err.name !== 'AbortError') {
                    console.error('Download failed:', err);
                    alert('No se pudo descargar. Intentá de nuevo.');
                }
            }
        });

        // ── Button groups ─────────────────────────────────────────────────────
        document.querySelectorAll('[data-size]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('[data-size]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                fontSize = parseInt(btn.dataset.size, 10);
                drawCanvas();
            });
        });

        document.querySelectorAll('[data-weight]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('[data-weight]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                fontWeight = parseInt(btn.dataset.weight, 10);
                drawCanvas();
            });
        });

        document.querySelectorAll('[data-align]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('[data-align]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                textAlign = btn.dataset.align;
                drawCanvas();
            });
        });
    </script>
</body>
</html>
